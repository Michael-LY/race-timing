name: Build and deploy

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: race-timing

jobs:
  # ═══════════════════════════════════════════════════════════
  # Job 1: 构建 + 测试 + 上传 artifact
  # ═══════════════════════════════════════════════════════════
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build release archive
        run: |
          chmod +x scripts/build_release.sh
          ./scripts/build_release.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: race-timing-release
          path: dist/race-timing-release.tar.gz

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/race-timing-release.tar.gz

  # ═══════════════════════════════════════════════════════════
  # Job 2: 部署到远程服务器
  # ═══════════════════════════════════════════════════════════
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release archive (fresh)
        run: |
          chmod +x scripts/build_release.sh
          ./scripts/build_release.sh

      - name: Deploy to remote server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          # ── 0. 调试输出 ────────────────────────────────────
          echo "=== Debug: workspace ==="
          echo "PWD=$(pwd)"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "DEPLOY_HOST=$DEPLOY_HOST"
          echo "DEPLOY_USER=$DEPLOY_USER"
          echo "DEPLOY_PATH=$DEPLOY_PATH"
          echo "DEPLOY_PORT=$DEPLOY_PORT"

          echo "=== Debug: listing dist/ ==="
          ls -la "$GITHUB_WORKSPACE/dist/" || echo "dist/ NOT FOUND"

          echo "=== Debug: listing deploy/ ==="
          ls -la "$GITHUB_WORKSPACE/deploy/" || echo "deploy/ NOT FOUND"

          echo "=== Debug: stat artifact ==="
          stat "$GITHUB_WORKSPACE/dist/race-timing-release.tar.gz" || echo "stat failed"
          file "$GITHUB_WORKSPACE/dist/race-timing-release.tar.gz" || echo "file failed"

          # ── 1. SSH 私钥 → ssh-agent ───────────────────────
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key
          ssh-keyscan -H -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # ── 2. 上传文件（cat pipe → SSH，替代 scp）─────────
          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -p "${DEPLOY_PORT:-22}")
          ARTIFACT="$GITHUB_WORKSPACE/dist/race-timing-release.tar.gz"
          ARCHIVE_NAME="race-timing-release.tar.gz"

          echo "=== upload artifact ==="
          cat "$ARTIFACT" | ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cat > /tmp/$ARCHIVE_NAME"
          echo "upload artifact: exit code $?"

          echo "=== upload service config ==="
          cat "$GITHUB_WORKSPACE/deploy/race-timing.service" | ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cat > /tmp/race-timing.service"
          echo "upload service: exit code $?"

          echo "=== upload nginx config ==="
          cat "$GITHUB_WORKSPACE/deploy/nginx/race-timing.conf" | ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cat > /tmp/race-timing.conf"
          echo "upload nginx: exit code $?"

          # ── 3. SSH 远程执行安装 ────────────────────────────
          echo "=== Running remote install ==="
          ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<REMOTE
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          echo "--- Remote: install system packages ---"
          if [ "\$(id -u)" -eq 0 ]; then
            apt-get update
            apt-get install -y python3 python3-venv python3-pip nginx
          else
            sudo apt-get update
            sudo apt-get install -y python3 python3-venv python3-pip nginx
          fi

          echo "--- Remote: create directories ---"
          mkdir -p $DEPLOY_PATH/current $DEPLOY_PATH/shared/instance $DEPLOY_PATH/shared/uploads

          echo "--- Remote: extract archive ---"
          rm -rf $DEPLOY_PATH/current/* $DEPLOY_PATH/current/.[!.]* 2>/dev/null || true
          tar -xzf /tmp/$ARCHIVE_NAME -C $DEPLOY_PATH/current
          rm -f /tmp/$ARCHIVE_NAME

          echo "--- Remote: generate .env if needed ---"
          if [ ! -f $DEPLOY_PATH/shared/.env ]; then
            GENERATED_KEY=\$(python3 -c "import secrets; print(secrets.token_hex(32))")
            cat > $DEPLOY_PATH/shared/.env <<ENVEOF
          SECRET_KEY=\$GENERATED_KEY
          DATABASE_URL=sqlite:///$DEPLOY_PATH/shared/instance/timing.db
          ENVEOF
            chmod 600 $DEPLOY_PATH/shared/.env
            echo "Created .env with generated SECRET_KEY"
          else
            echo "Using existing .env"
          fi

          echo "--- Remote: install Python deps ---"
          python3 -m venv $DEPLOY_PATH/current/.venv
          $DEPLOY_PATH/current/.venv/bin/pip install --upgrade pip
          $DEPLOY_PATH/current/.venv/bin/pip install -r $DEPLOY_PATH/current/requirements.txt

          echo "--- Remote: symlink shared dirs ---"
          ln -sfn $DEPLOY_PATH/shared/instance $DEPLOY_PATH/current/instance
          ln -sfn $DEPLOY_PATH/shared/uploads $DEPLOY_PATH/current/uploads

          echo "--- Remote: install systemd + nginx config ---"
          sudo install -m 0644 /tmp/race-timing.service /etc/systemd/system/race-timing.service
          sudo install -m 0644 /tmp/race-timing.conf /etc/nginx/sites-available/race-timing.conf
          sudo ln -sfn /etc/nginx/sites-available/race-timing.conf /etc/nginx/sites-enabled/race-timing.conf
          sudo rm -f /etc/nginx/sites-enabled/default

          echo "--- Remote: restart services ---"
          sudo systemctl daemon-reload
          sudo systemctl enable race-timing || true
          sudo systemctl restart race-timing
          sudo nginx -t
          sudo systemctl restart nginx || true

          echo "--- Remote: verify ---"
          echo "race-timing service status: \$(systemctl is-active race-timing 2>/dev/null || echo 'unknown')"
          HTTP_CODE=\$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/ 2>/dev/null || echo "unreachable")
          echo "HTTP 127.0.0.1:8000 → \$HTTP_CODE"
          REMOTE

          echo ""
          echo "═══════════════════════════════════════════════"
          echo "  Deployment completed successfully."
          echo "═══════════════════════════════════════════════"
