name: Build and deploy

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: race-timing

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Make scripts executable
        run: chmod +x scripts/build_release.sh scripts/deploy.sh

      - name: Build release archive
        run: ./scripts/build_release.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: race-timing-release
          path: dist/race-timing-release.tar.gz

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/race-timing-release.tar.gz

      # ─── Deploy steps ───────────────────────────────────────
      - name: Check deployment secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ] && [ -n "${{ secrets.DEPLOY_USER }}" ] && [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifact
        if: steps.check-secrets.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: race-timing-release
          path: dist/

      - name: Set up SSH key
        if: steps.check-secrets.outputs.ready == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key
          ssh-keyscan -H -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verify artifact
        if: steps.check-secrets.outputs.ready == 'true'
        run: ls -la "$GITHUB_WORKSPACE/dist/"

      - name: Deploy to remote server
        if: steps.check-secrets.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: >
          ./scripts/deploy.sh
          "$GITHUB_WORKSPACE/dist/race-timing-release.tar.gz"
