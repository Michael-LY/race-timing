name: Build and deploy

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: race-timing

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build release archive
        run: |
          chmod +x scripts/build_release.sh
          ./scripts/build_release.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: race-timing-release
          path: dist/race-timing-release.tar.gz

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/race-timing-release.tar.gz

      # ─── Deploy ─────────────────────────────────────────────
      - name: Check deployment secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ] && [ -n "${{ secrets.DEPLOY_USER }}" ] && [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifact
        if: steps.check-secrets.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: race-timing-release
          path: dist/

      - name: Set up SSH key
        if: steps.check-secrets.outputs.ready == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key
          ssh-keyscan -H -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to remote server
        if: steps.check-secrets.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -p "${DEPLOY_PORT:-22}")
          ARTIFACT="$GITHUB_WORKSPACE/dist/race-timing-release.tar.gz"
          ARCHIVE_NAME="race-timing-release.tar.gz"

          # 上传构建产物和系统服务配置
          scp "${SSH_OPTS[@]}" "$ARTIFACT" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/$ARCHIVE_NAME"
          scp "${SSH_OPTS[@]}" "$GITHUB_WORKSPACE/deploy/race-timing.service" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/race-timing.service"
          scp "${SSH_OPTS[@]}" "$GITHUB_WORKSPACE/deploy/nginx/race-timing.conf" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/race-timing.conf"

          # 远程执行安装脚本
          # <<REMOTE (无引号) → 本地展开 $DEPLOY_PATH 等变量
          # \$() / \$var → 转义后原样送到远端执行
          ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<REMOTE
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          if [ "\$(id -u)" -eq 0 ]; then
            apt-get update
            apt-get install -y python3 python3-venv python3-pip nginx
          else
            sudo apt-get update
            sudo apt-get install -y python3 python3-venv python3-pip nginx
          fi

          mkdir -p $DEPLOY_PATH/current $DEPLOY_PATH/shared/instance $DEPLOY_PATH/shared/uploads
          rm -rf $DEPLOY_PATH/current/* $DEPLOY_PATH/current/.[!.]* 2>/dev/null || true
          tar -xzf /tmp/$ARCHIVE_NAME -C $DEPLOY_PATH/current
          rm -f /tmp/$ARCHIVE_NAME

          if [ ! -f $DEPLOY_PATH/shared/.env ]; then
            GENERATED_KEY=\$(python3 -c "import secrets; print(secrets.token_hex(32))")
            cat > $DEPLOY_PATH/shared/.env <<ENVEOF
          SECRET_KEY=\$GENERATED_KEY
          DATABASE_URL=sqlite:///$DEPLOY_PATH/shared/instance/timing.db
          ENVEOF
            chmod 600 $DEPLOY_PATH/shared/.env
          fi

          python3 -m venv $DEPLOY_PATH/current/.venv
          $DEPLOY_PATH/current/.venv/bin/pip install --upgrade pip
          $DEPLOY_PATH/current/.venv/bin/pip install -r $DEPLOY_PATH/current/requirements.txt

          ln -sfn $DEPLOY_PATH/shared/instance $DEPLOY_PATH/current/instance
          ln -sfn $DEPLOY_PATH/shared/uploads $DEPLOY_PATH/current/uploads

          install -m 0644 /tmp/race-timing.service /etc/systemd/system/race-timing.service
          install -m 0644 /tmp/race-timing.conf /etc/nginx/sites-available/race-timing.conf
          ln -sfn /etc/nginx/sites-available/race-timing.conf /etc/nginx/sites-enabled/race-timing.conf
          rm -f /etc/nginx/sites-enabled/default

          systemctl daemon-reload
          systemctl enable race-timing || true
          systemctl restart race-timing
          nginx -t
          systemctl reload nginx || true
          REMOTE

          echo "Deployment completed successfully."
