{% extends "base.html" %}
{% block title %}Edit {{ session.name }} - Race Timing{% endblock %}

{% block content %}
<div class="mt-3 mb-4">
    <a href="{{ url_for('main.event_detail', event_id=session.event_id) }}" class="no-underline text-theme-secondary hover:text-theme-primary inline-flex items-center gap-1 text-sm">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Event
    </a>
</div>
<h2 class="text-xl font-bold text-theme-primary">Edit Session</h2>
<div class="card rounded-lg mt-3">
    <div class="p-5">
        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="mb-4">
                <label for="name" class="block text-sm font-medium text-theme-primary mb-1">Session Name *</label>
                <input type="text" class="themed-input" id="name" name="name" required value="{{ session.name }}">
            </div>
            <div class="mb-4">
                <label for="session_type" class="block text-sm font-medium text-theme-primary mb-1">Session Type *</label>
                <select class="themed-select" id="session_type" name="session_type" required>
                    {% for st in session_types %}
                    <option value="{{ st }}" {% if session.session_type == st %}selected{% endif %}>{{ st }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn-primary px-4 py-2 rounded-md">
                <i data-lucide="check" class="w-4 h-4"></i> Save Changes
            </button>
            <a href="{{ url_for('main.event_detail', event_id=session.event_id) }}" class="btn-ghost ml-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
