{% extends "base.html" %}
{% block title %}Create Event - Race Timing{% endblock %}

{% block content %}
<div class="mt-3 mb-4">
    <a href="{{ url_for('main.index') }}" class="no-underline text-theme-secondary hover:text-theme-primary inline-flex items-center gap-1 text-sm">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Events
    </a>
</div>
<h2 class="text-xl font-bold text-theme-primary">Create New Event</h2>
<div class="card rounded-lg mt-3 stagger-item">
    <div class="p-5">
        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="mb-4">
                <label for="name" class="block text-sm font-medium text-theme-primary mb-1">Event Name *</label>
                <input type="text" class="themed-input" id="name" name="name" required
                       placeholder="e.g. GTWC Asia 2025 - Suzuka">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="championship" class="block text-sm font-medium text-theme-primary mb-1">Championship</label>
                    <input type="text" class="themed-input" id="championship" name="championship"
                           placeholder="e.g. GTWC Asia">
                </div>
                <div>
                    <label for="year" class="block text-sm font-medium text-theme-primary mb-1">Year</label>
                    <input type="number" class="themed-input" id="year" name="year"
                           placeholder="e.g. 2025" min="1900" max="2100">
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="track" class="block text-sm font-medium text-theme-primary mb-1">Track</label>
                    <input type="text" class="themed-input" id="track" name="track"
                           placeholder="e.g. Suzuka Circuit">
                </div>
                <div>
                    <label for="event_date" class="block text-sm font-medium text-theme-primary mb-1">Event Date</label>
                    <input type="date" class="themed-input" id="event_date" name="event_date">
                </div>
            </div>
            <button type="submit" class="btn-primary px-4 py-2 rounded-md">
                <i data-lucide="check" class="w-4 h-4"></i> Create Event
            </button>
            <a href="{{ url_for('main.index') }}" class="btn-ghost ml-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
