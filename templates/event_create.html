{% extends "base.html" %}
{% block title %}Create Event - Race Timing{% endblock %}

{% block content %}
<div class="mt-3 mb-4">
    <a href="{{ url_for('main.index') }}" class="no-underline text-gray-600 hover:text-gray-900 inline-flex items-center gap-1 text-sm">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Events
    </a>
</div>
<h2 class="text-xl font-bold">Create New Event</h2>
<div class="bg-white rounded-lg shadow-sm mt-3">
    <div class="p-5">
        <form method="POST">
            <div class="mb-4">
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Event Name *</label>
                <input type="text" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" id="name" name="name" required
                       placeholder="e.g. GTWC Asia 2025 - Suzuka">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="championship" class="block text-sm font-medium text-gray-700 mb-1">Championship</label>
                    <input type="text" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" id="championship" name="championship"
                           placeholder="e.g. GTWC Asia">
                </div>
                <div>
                    <label for="year" class="block text-sm font-medium text-gray-700 mb-1">Year</label>
                    <input type="number" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" id="year" name="year"
                           placeholder="e.g. 2025" min="1900" max="2100">
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="track" class="block text-sm font-medium text-gray-700 mb-1">Track</label>
                    <input type="text" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" id="track" name="track"
                           placeholder="e.g. Suzuka Circuit">
                </div>
                <div>
                    <label for="event_date" class="block text-sm font-medium text-gray-700 mb-1">Event Date</label>
                    <input type="date" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" id="event_date" name="event_date">
                </div>
            </div>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 inline-flex items-center gap-1.5 text-sm">
                <i data-lucide="check" class="w-4 h-4"></i> Create Event
            </button>
            <a href="{{ url_for('main.index') }}" class="bg-white text-gray-700 px-4 py-2 rounded-md border border-gray-300 hover:bg-gray-50 text-sm no-underline ml-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
