{% extends "base.html" %}
{% block title %}Change Password - Race Timing{% endblock %}

{% block content %}
<div class="mt-3 mb-4">
    <a href="{{ url_for('main.user_list' if current_user.is_admin else 'main.index') }}" class="no-underline text-theme-secondary hover:text-theme-primary inline-flex items-center gap-1 text-sm">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back
    </a>
</div>

<div class="flex items-center justify-center min-h-[50vh]">
    <div class="card-glass w-full max-w-md p-8 rounded-lg stagger-item">
        <div class="text-center mb-6">
            <i data-lucide="key" class="w-10 h-10 text-theme-muted mx-auto"></i>
            <h2 class="mt-3 text-xl font-bold text-theme-primary">Change Password</h2>
            <p class="text-sm text-theme-secondary mt-1">{{ user.username }}</p>
        </div>
        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-theme-primary mb-1">New Password</label>
                <input type="password" id="password" name="password" required minlength="6" class="themed-input">
                <p class="text-xs text-theme-secondary mt-1">At least 6 characters</p>
            </div>
            <div class="mb-6">
                <label for="confirm" class="block text-sm font-medium text-theme-primary mb-1">Confirm Password</label>
                <input type="password" id="confirm" name="confirm" required class="themed-input">
            </div>
            <button type="submit" class="btn-primary w-full py-2 rounded-md font-medium inline-flex items-center justify-center gap-2">
                <i data-lucide="key" class="w-4 h-4"></i> Change Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
