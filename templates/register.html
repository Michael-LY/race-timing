{% extends "base.html" %}
{% block title %}Register - Race Timing{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 w-full max-w-md p-8">
        <div class="text-center mb-6">
            <i data-lucide="user-plus" class="w-10 h-10 text-gray-400 mx-auto"></i>
            <h2 class="mt-3 text-xl font-bold text-gray-900">Register New User</h2>
        </div>
        <form method="POST">
            <div class="mb-4">
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="username" name="username" required autofocus
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required minlength="6"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <p class="text-xs text-gray-500 mt-1">At least 6 characters</p>
            </div>
            <div class="mb-4">
                <label for="confirm" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input type="password" id="confirm" name="confirm" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div class="mb-6">
                <label class="inline-flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" name="is_admin" class="w-4 h-4 accent-blue-600">
                    <span class="text-sm text-gray-700">Admin privileges</span>
                </label>
                <p class="text-xs text-gray-500 mt-1">Admins can upload CSV files and manage events</p>
            </div>
            <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 font-medium inline-flex items-center justify-center gap-2">
                <i data-lucide="user-plus" class="w-4 h-4"></i> Create User
            </button>
        </form>
    </div>
</div>
{% endblock %}
