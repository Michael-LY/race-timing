{% extends "base.html" %}
{% block title %}Register - Race Timing{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="card-glass w-full max-w-md p-8 rounded-lg stagger-item">
        <div class="text-center mb-6">
            <i data-lucide="user-plus" class="w-10 h-10 text-theme-muted mx-auto"></i>
            <h2 class="mt-3 text-xl font-bold text-theme-primary">Register New User</h2>
        </div>
        <form method="POST">
            <div class="mb-4">
                <label for="username" class="block text-sm font-medium text-theme-primary mb-1">Username</label>
                <input type="text" id="username" name="username" required autofocus class="themed-input">
            </div>
            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-theme-primary mb-1">Password</label>
                <input type="password" id="password" name="password" required minlength="6" class="themed-input">
                <p class="text-xs text-theme-secondary mt-1">At least 6 characters</p>
            </div>
            <div class="mb-4">
                <label for="confirm" class="block text-sm font-medium text-theme-primary mb-1">Confirm Password</label>
                <input type="password" id="confirm" name="confirm" required class="themed-input">
            </div>
            <div class="mb-6">
                <label class="inline-flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" name="is_admin" class="w-4 h-4">
                    <span class="text-sm text-theme-primary">Admin privileges</span>
                </label>
                <p class="text-xs text-theme-secondary mt-1">Admins can upload CSV files and manage events</p>
            </div>
            <button type="submit"
                    class="btn-primary w-full py-2 rounded-md font-medium inline-flex items-center justify-center gap-2">
                <i data-lucide="user-plus" class="w-4 h-4"></i> Create User
            </button>
        </form>
    </div>
</div>
{% endblock %}
