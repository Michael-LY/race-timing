{% extends "base.html" %}
{% block title %}Edit User - Race Timing{% endblock %}

{% block content %}
<div class="mt-3 mb-4">
    <a href="{{ url_for('main.user_list') }}" class="no-underline text-theme-secondary hover:text-theme-primary inline-flex items-center gap-1 text-sm">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Users
    </a>
</div>

<div class="flex items-center justify-center min-h-[50vh]">
    <div class="card-glass w-full max-w-md p-8 rounded-lg stagger-item">
        <div class="text-center mb-6">
            <i data-lucide="user" class="w-10 h-10 text-theme-muted mx-auto"></i>
            <h2 class="mt-3 text-xl font-bold text-theme-primary">Edit User</h2>
            <p class="text-sm text-theme-secondary mt-1">{{ user.username }}</p>
        </div>
        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="mb-4">
                <label for="username" class="block text-sm font-medium text-theme-primary mb-1">Username</label>
                <input type="text" id="username" name="username" value="{{ user.username }}" required autofocus class="themed-input">
            </div>
            <div class="mb-6">
                <label class="inline-flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" name="is_admin" class="w-4 h-4"{% if user.is_admin %} checked{% endif %}>
                    <span class="text-sm text-theme-primary">Admin privileges</span>
                </label>
            </div>
            <button type="submit" class="btn-primary w-full py-2 rounded-md font-medium inline-flex items-center justify-center gap-2">
                <i data-lucide="save" class="w-4 h-4"></i> Save
            </button>
        </form>
    </div>
</div>
{% endblock %}
