{% extends "base.html" %}
{% block title %}Edit {{ event.name }} - Race Timing{% endblock %}

{% block content %}
<div class="mt-3 mb-4">
    <a href="{{ url_for('main.event_detail', event_id=event.id) }}" class="no-underline text-theme-secondary hover:text-theme-primary inline-flex items-center gap-1 text-sm">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Event
    </a>
</div>
<h2 class="text-xl font-bold text-theme-primary">Edit Event</h2>
<div class="card rounded-lg mt-3">
    <div class="p-5">
        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="mb-4">
                <label for="name" class="block text-sm font-medium text-theme-primary mb-1">Event Name *</label>
                <input type="text" class="themed-input" id="name" name="name" required value="{{ event.name }}">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="championship" class="block text-sm font-medium text-theme-primary mb-1">Championship</label>
                    <input type="text" class="themed-input" id="championship" name="championship" value="{{ event.championship or '' }}">
                </div>
                <div>
                    <label for="year" class="block text-sm font-medium text-theme-primary mb-1">Year</label>
                    <input type="number" class="themed-input" id="year" name="year" value="{{ event.year or '' }}" min="1900" max="2100">
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="track" class="block text-sm font-medium text-theme-primary mb-1">Track</label>
                    <input type="text" class="themed-input" id="track" name="track" value="{{ event.track or '' }}">
                </div>
                <div>
                    <label for="event_date" class="block text-sm font-medium text-theme-primary mb-1">Event Date</label>
                    <input type="date" class="themed-input" id="event_date" name="event_date" value="{{ event.event_date or '' }}">
                </div>
            </div>
            <button type="submit" class="btn-primary px-4 py-2 rounded-md">
                <i data-lucide="check" class="w-4 h-4"></i> Save Changes
            </button>
            <a href="{{ url_for('main.event_detail', event_id=event.id) }}" class="btn-ghost ml-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
